[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vision-backend"
version = "1.0.0"
description = "Vision low-code ML platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-socketio>=5.11.0",
    "sqlmodel>=0.0.19",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.3.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "jinja2>=3.1.0",
    "werkzeug>=3.0.0",
    "flatten-json>=0.1.14",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
